[project]
name = "hse-study-agent"
version = "0.1.0"
description = "Учебный агент ВШЭ: источники, дедлайны и план дня."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "telethon>=1.42,<2",
    "tzdata>=2025.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: требует отдельную PostgreSQL БД через HSE_TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
