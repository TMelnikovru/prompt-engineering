name: Checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hse_agent_test
          POSTGRES_USER: hse_test
          # Одноразовая тестовая БД CI; это не пароль реального сервера.
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hse_test -d hse_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HSE_TEST_DATABASE_URL: postgresql+psycopg://hse_test:ci_test_only@127.0.0.1:5432/hse_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests including real PostgreSQL
        run: uv run pytest
      - run: uv run python -m scripts.export_openapi --check
      - name: Check migrations in application image
        run: |
          docker build -t hse-study-agent-ci .
          docker run --rm --network host -e HSE_DATABASE_URL="$HSE_TEST_DATABASE_URL" hse-study-agent-ci python -m alembic current
      - name: Validate deployment files
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: |
          bash -n deploy/prepare.sh deploy/deploy.sh deploy/install-cron.sh
          docker compose config --quiet

  deployment:
    runs-on: ubuntu-latest
    env:
      HSE_DEPLOY_PROJECT: hse-study-agent-ci
    steps:
      - uses: actions/checkout@v4
      - name: Deploy an isolated stack with the production script
        run: |
          task_root="$RUNNER_TEMP/hse-study-agent"
          bash deploy/prepare.sh "$task_root" > /dev/null
          git branch --force ci/preview HEAD
          git clone --quiet --shared . "$task_root/repository"
          printf 'HSE_DEPLOY_BRANCH=ci/preview\nHSE_DEPLOY_PROJECT=hse-study-agent-ci\n' > "$task_root/deploy.env"
          bash deploy/deploy.sh "$task_root"
      - name: Remove test containers and volumes
        if: always()
        run: |
          docker compose --project-name hse-study-agent-ci \
            --env-file "$RUNNER_TEMP/hse-study-agent/.env" down --volumes
